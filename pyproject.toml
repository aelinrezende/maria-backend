[project]
name = "maria-backend"
version = "0.1.0"
description = "Backend para o sistema Mar.IA - TCC"
authors = [
    {name = "aelin",email = "aelinrezende@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13.0,<3.14"
dependencies = [
    "fastapi[all] (>=0.116.0,<0.117.0)",
    "fastapi-restful[all] (>=0.6.0,<0.7.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "fastapi-utils (>=0.8.0,<0.9.0)",
    "sentence-transformers (>=2.2.0,<3.0.0)",
    "faiss-cpu (>=1.7.0,<2.0.0)",
    "anthropic[aiohttp] (>=0.68.0,<0.69.0)",
    "redis (>=4.5.0,<5.0.0)",
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "asyncpg (>=0.29.0,<1.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "python-multipart (>=0.0.6,<1.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.0,<2.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "numpy (>=2.1.0,<2.3.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "loguru (>=0.7.0,<1.0.0)",
    "uvicorn[standard] (>=0.23.0,<1.0.0)",
    "pgvector (>=0.4.1,<0.5.0)",
    "ollama (>=0.5.1,<0.6.0)",
    "wireup (>=2.0.0,<3.0.0)",
    "pdfplumber (>=0.11.7,<0.12.0)",
    "openai (>=1.97.0,<2.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "markitdown[all] (>=0.1.3,<0.2.0)",
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[tool.poetry.group.dev.dependencies]
pyrefly = "^0.23.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyrefly]
site-package-path = ["C:\\Users\\Marco\\AppData\\Local\\pypoetry\\Cache\\virtualenvs\\maria-backend-6h-KCwWU-py3.13\\Lib\\site-packages"]

[tool.flake8]
max-line-length = 100

[tool.isort]
profile = "black"