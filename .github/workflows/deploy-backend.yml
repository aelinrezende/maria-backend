name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCLOUD_PROJECT }}
  REGION: ${{ vars.GCLOUD_REGION || 'us-central1' }}
  SERVICE_NAME: maria-backend
  IMAGE_NAME: maria-backend
  REGISTRY: ${{ vars.GCLOUD_REGION || 'us-central1' }}-docker.pkg.dev

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Docker Image
        run: |
          # Build the Docker image
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest .

          # Push the Docker image
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          # Deploy to Cloud Run
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 10 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "DATABASE_URL=${{ env.DATABASE_URL }}" \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --set-env-vars "GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}" \
            --set-env-vars "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --set-env-vars "DEFAULT_LLM_PROVIDER=${{ env.DEFAULT_LLM_PROVIDER }}" \
            --set-env-vars "DEBUG=false" \
            --set-env-vars "LOG_LEVEL=INFO" \
            --set-env-vars "ALLOWED_ORIGINS=${{ env.ALLOWED_ORIGINS }}" \
            --set-env-vars "MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}" \
            --set-env-vars "MAILGUN_DOMAIN=${{ env.MAILGUN_DOMAIN }}" \
            --set-env-vars "MAILGUN_API_URL=${{ env.MAILGUN_API_URL }}" \
            --set-env-vars "MAILGUN_TEST_EMAIL=${{ env.MAILGUN_TEST_EMAIL }}" \
            --set-env-vars "CHUNK_SIZE=${{ env.CHUNK_SIZE }}" \
            --set-env-vars "CHUNK_OVERLAP=${{ env.CHUNK_OVERLAP }}" \
            --set-env-vars "RAG_TOP_K_CHUNKS=${{ env.RAG_TOP_K_CHUNKS }}" \
            --set-env-vars "RAG_MAX_SEARCH_ATTEMPTS=${{ env.RAG_MAX_SEARCH_ATTEMPTS }}" \
            --set-env-vars "EMBEDDING_MODEL=${{ env.EMBEDDING_MODEL }}" \
            --set-env-vars "EMBEDDING_DIMENSION=${{ env.EMBEDDING_DIMENSION }}" \
            --set-env-vars "EMBEDDING_PROVIDER=${{ env.EMBEDDING_PROVIDER }}" \
            --set-env-vars "CLAUDE_MODEL=${{ env.CLAUDE_MODEL }}" \
            --set-env-vars "CLAUDE_MAX_TOKENS=${{ env.CLAUDE_MAX_TOKENS }}" \
            --set-env-vars "CLAUDE_TEMPERATURE=${{ env.CLAUDE_TEMPERATURE }}" \
            --set-env-vars "GEMINI_MODEL=${{ env.GEMINI_MODEL }}" \
            --set-env-vars "GEMINI_MAX_TOKENS=${{ env.GEMINI_MAX_TOKENS }}" \
            --set-env-vars "GEMINI_TEMPERATURE=${{ env.GEMINI_TEMPERATURE }}" \
            --set-env-vars "JWT_ALGORITHM=${{ env.JWT_ALGORITHM }}" \
            --set-env-vars "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${{ env.JWT_ACCESS_TOKEN_EXPIRE_MINUTES }}" \
            --set-env-vars "INVITATION_CODE_EXPIRE_DAYS=${{ env.INVITATION_CODE_EXPIRE_DAYS }}"

      - name: Health Check
        run: |
          # Get service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')

          # Wait a bit for service to be ready
          sleep 30

          # Test health endpoint
          curl -f "$SERVICE_URL/health" || exit 1

          echo "✅ Deployment successful! Service URL: $SERVICE_URL"
          echo "Service URL: $SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Show Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "🚀 Service deployed at: $SERVICE_URL"
          echo "📊 Monitor at: https://console.cloud.google.com/run/detail/${{ env.REGION }}/${{ env.SERVICE_NAME }}"
