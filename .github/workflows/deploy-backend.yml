name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCLOUD_PROJECT }}
  REGION: ${{ vars.GCLOUD_REGION || 'us-central1' }}
  SERVICE_NAME: maria-api
  IMAGE_NAME: maria-api
  DOCKER_REPO: docker
  REGISTRY: ${{ vars.GCLOUD_REGION || 'us-central1' }}-docker.pkg.dev

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space (Unified cleanup)
        run: |
          echo "🧹 Running unified disk space cleanup..."
          chmod +x free_disk_space.sh
          sudo ./free_disk_space.sh

      - name: Google Auth
        id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Check and reinstall Docker if needed
        run: |
          echo "🐳 Checking Docker daemon status..."

          # Check if Docker is installed and running
          if ! sudo docker info >/dev/null 2>&1; then
            echo "❌ Docker daemon is not running or not installed"

            # Check if Docker service exists (better indicator than command -v)
            if ! systemctl list-unit-files | grep -q docker.service 2>/dev/null; then
              echo "🔧 Docker service not found - reinstalling Docker completely..."

              # Install Docker
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh || echo "   Docker installation failed"

              # Add user to docker group
              sudo usermod -aG docker $USER || echo "   Failed to add user to docker group"

              # Start Docker service
              sudo systemctl start docker || echo "   systemctl start failed"
              sudo service docker start || echo "   service start failed"

              echo "✅ Docker reinstalled successfully"
            else
              echo "🔄 Docker service exists but daemon is not running - attempting to start..."
              sudo systemctl start docker || echo "   systemctl start failed"
              sudo service docker start || echo "   service start failed"

              # If systemctl fails, try alternative approach
              if ! sudo docker info >/dev/null 2>&1; then
                echo "🔄 Systemctl failed, trying alternative Docker start..."
                sudo dockerd &>/dev/null &
                sleep 10
              fi
            fi

            # Wait for Docker to start
            sleep 15

            # Check if Docker is working now
            if sudo docker info >/dev/null 2>&1; then
              echo "✅ Docker daemon is now running"
              sudo docker version || echo "   Could not get Docker version"
            else
              echo "❌ Failed to start Docker daemon after installation"
              echo "   Available disk space:"
              df -h
              echo "   Checking Docker installation status:"
              which docker || echo "   Docker binary not found"
              systemctl list-unit-files | grep docker || echo "   Docker service not found"
              exit 1
            fi
          else
            echo "✅ Docker daemon is already running"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Auth
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Docker Image (Optimized for model download)
        run: |
          echo "🐳 Starting optimized Docker build with model download..."
          echo "🔍 Build started at: $(date)"
          START_TIME=$(date +%s)

          # Set build arguments for model download
          export DOCKER_BUILDKIT=1
          export BUILDKIT_PROGRESS=plain

          # Build the Docker image with extended timeout and cache
          echo "📦 Building Docker image (this may take 10-15 minutes due to model download)..."
          docker buildx build \
            --build-arg HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            --build-arg EMBEDDING_MODEL="${{ vars.EMBEDDING_MODEL || 'intfloat/multilingual-e5-base' }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:latest \
            --load \
            .

          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          BUILD_MINUTES=$((BUILD_DURATION / 60))

          echo "✅ Docker build completed in ${BUILD_MINUTES} minutes"

          # Check final image size
          IMAGE_SIZE=$(docker images ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:latest --format "table {{.Size}}" | tail -n 1)
          echo "📊 Final image size: ${IMAGE_SIZE}"

          # Push the Docker image
          echo "📤 Pushing Docker image to registry..."
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:latest

          echo "🎉 Docker build and push completed successfully!"

      - name: Deploy to Cloud Run
        run: |
          # Deploy to Cloud Run
          echo "🚀 Deploying to production environment"
          echo "📊 Service name: ${{ env.SERVICE_NAME }}"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ vars.CLOUD_SQL_CONNECTION_NAME }} \
            --memory 4Gi \
            --cpu 2 \
            --timeout 1000 \
            --concurrency 10 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --set-env-vars "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --set-env-vars "DEFAULT_LLM_PROVIDER=${{ vars.DEFAULT_LLM_PROVIDER || 'gemini' }}" \
            --set-env-vars "DEBUG=false" \
            --set-env-vars "LOG_LEVEL=INFO" \
            --set-env-vars "^|^ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" \
            --set-env-vars "MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}" \
            --set-env-vars "MAILGUN_DOMAIN=${{ vars.MAILGUN_DOMAIN }}" \
            --set-env-vars "MAILGUN_API_URL=${{ vars.MAILGUN_API_URL || 'https://api.mailgun.net' }}" \
            --set-env-vars "MAILGUN_TEST_EMAIL=${{ vars.MAILGUN_TEST_EMAIL || secrets.MAILGUN_TEST_EMAIL }}" \
            --set-env-vars "CHUNK_SIZE=${{ vars.CHUNK_SIZE || '512' }}" \
            --set-env-vars "CHUNK_OVERLAP=${{ vars.CHUNK_OVERLAP || '50' }}" \
            --set-env-vars "RAG_TOP_K_CHUNKS=${{ vars.RAG_TOP_K_CHUNKS || '5' }}" \
            --set-env-vars "RAG_MAX_SEARCH_ATTEMPTS=${{ vars.RAG_MAX_SEARCH_ATTEMPTS || '2' }}" \
            --set-env-vars "EMBEDDING_MODEL=${{ vars.EMBEDDING_MODEL || 'intfloat/multilingual-e5-base' }}" \
            --set-env-vars "EMBEDDING_DIMENSION=${{ vars.EMBEDDING_DIMENSION || '768' }}" \
            --set-env-vars "EMBEDDING_PROVIDER=${{ vars.EMBEDDING_PROVIDER || 'local' }}" \
            --set-env-vars "CLAUDE_MODEL=${{ vars.CLAUDE_MODEL || 'claude-3-5-sonnet-20241022' }}" \
            --set-env-vars "CLAUDE_MAX_TOKENS=${{ vars.CLAUDE_MAX_TOKENS || '4096' }}" \
            --set-env-vars "CLAUDE_TEMPERATURE=${{ vars.CLAUDE_TEMPERATURE || '0.7' }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-1.5-pro' }}" \
            --set-env-vars "GEMINI_MAX_TOKENS=${{ vars.GEMINI_MAX_TOKENS || '4096' }}" \
            --set-env-vars "GEMINI_TEMPERATURE=${{ vars.GEMINI_TEMPERATURE || '0.7' }}" \
            --set-env-vars "JWT_ALGORITHM=${{ vars.JWT_ALGORITHM || 'HS256' }}" \
            --set-env-vars "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${{ vars.JWT_ACCESS_TOKEN_EXPIRE_MINUTES || '10080' }}" \
            --set-env-vars "INVITATION_CODE_EXPIRE_DAYS=${{ vars.INVITATION_CODE_EXPIRE_DAYS || '7' }}" \
            --set-env-vars "HF_TOKEN=${{ secrets.HF_TOKEN }}"

      - name: Show Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "🚀 Service deployed at: $SERVICE_URL"
          echo "📊 Monitor at: https://console.cloud.google.com/run/detail/${{ env.REGION }}/${{ env.SERVICE_NAME }}/metrics?project=${{ env.PROJECT_ID }}"
